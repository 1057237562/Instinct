[package]
name = "l3_builder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap", "flate2-rust_backend", "brotli"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = "thin"
