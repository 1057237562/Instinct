[package]
name = "dataset_compiler"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Compile Instinct JSONL corpora into Parquet"
license = "Apache-2.0"
publish = false

[[bin]]
name = "dataset_compiler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "60"
arrow-schema = "60"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
# gzip rides on parquet's pure-Rust flate2 backend, so no C zlib is required.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap", "flate2-rust_backend", "brotli"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
